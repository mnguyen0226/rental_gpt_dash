services:
  - name: rentalgpt-dash
    type: web
    runtime: python
    plan: free
    rootDir: dash
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 0 app:server
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
